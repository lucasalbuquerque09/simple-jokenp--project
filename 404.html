<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina nao encontrada</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f7f7f7, #e9eef7);
        color: #1f2937;
      }

      .box {
        width: min(92vw, 520px);
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        text-decoration: none;
        background: #0f172a;
        color: #ffffff;
        padding: 10px 14px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>Pagina nao encontrada</h1>
      <p>Redirecionando para o menu principal...</p>
      <a id="homeLink" href="/">Ir para o inicio</a>
    </main>

    <script>
      (function () {
        // On GitHub Pages project sites, the first path segment is the repo name.
        const segments = window.location.pathname.split("/").filter(Boolean);
        const basePath = segments.length ? "/" + segments[0] + "/" : "/";
        const homeUrl = window.location.origin + basePath;

        const link = document.getElementById("homeLink");
        link.href = homeUrl;

        window.setTimeout(function () {
          window.location.replace(homeUrl);
        }, 800);
      })();
    </script>
  </body>
</html>
